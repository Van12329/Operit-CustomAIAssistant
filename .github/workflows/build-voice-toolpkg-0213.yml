name: Build Voice ToolPkg v0.2.13
on:
  workflow_dispatch:
  push:
    branches: [toolpkg/voice-session-0.2.13]
    paths:
      - 'toolpkg/voice-session-v0.2.13/**'
      - '.github/workflows/build-voice-toolpkg-0213.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate canonical ToolPkg registration
        run: |
          set -euo pipefail
          ! grep -R "function:exports\." toolpkg/voice-session-v0.2.13
          ! grep -R "function: exports\." toolpkg/voice-session-v0.2.13
          grep -R "function:onCreate" toolpkg/voice-session-v0.2.13/{coordinator,voice,speech}/main.js
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("toolpkg/voice-session-v0.2.13")
          for k in ("coordinator","voice","speech"):
              m=json.loads((root/k/"manifest.json").read_text())
              assert m["schema_version"]==1
              assert m["api_version"]=="1.0.0"
              assert m["version"]=="0.2.13"
              assert (root/k/m["main"]).is_file()
          print("manifest/container preflight PASS")
          PY
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile source-first Voice and Speech helpers
        run: |
          set -euo pipefail
          ROOT=toolpkg/voice-session-v0.2.13
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          mkdir -p "$ROOT/voice/build/classes" "$ROOT/speech/build/classes" "$ROOT/voice/resources" "$ROOT/speech/resources" /tmp/d8v /tmp/d8s
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$ROOT/voice/build/classes" $(find "$ROOT/voice/src" -name '*.java')
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$ROOT/speech/build/classes" $(find "$ROOT/speech/src" -name '*.java')
          jar cf /tmp/voice.jar -C "$ROOT/voice/build/classes" .
          jar cf /tmp/speech.jar -C "$ROOT/speech/build/classes" .
          "$D8" --lib "$ANDROID_JAR" --min-api 26 --output /tmp/d8v /tmp/voice.jar
          "$D8" --lib "$ANDROID_JAR" --min-api 26 --output /tmp/d8s /tmp/speech.jar
          cp /tmp/d8v/classes.dex "$ROOT/voice/resources/voice-adapter.dex"
          cp /tmp/d8s/classes.dex "$ROOT/speech/resources/speech-adapter.dex"
      - name: Build Coordinator canary with upstream-equivalent zip layout
        run: |
          set -euo pipefail
          mkdir -p dist
          cd toolpkg/voice-session-v0.2.13/coordinator
          zip -q -r ../../../dist/Voice-Session-Coordinator-v0.2.13.toolpkg manifest.json main.js
          cd ../../..
          python3 - <<'PY'
          import json,zipfile
          p="dist/Voice-Session-Coordinator-v0.2.13.toolpkg"
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert "manifest.json" in names and "main.js" in names
              m=json.loads(z.read("manifest.json"))
              assert m["main"] in names
              assert m["toolpkg_id"]=="com.customai.voice_session_coordinator"
          print("Coordinator archive preflight PASS")
          PY
          (cd toolpkg/voice-session-v0.2.13/voice && zip -q -r ../../../dist/Android-VoiceService-Adapter-v0.2.13.toolpkg manifest.json main.js resources)
          (cd toolpkg/voice-session-v0.2.13/speech && zip -q -r ../../../dist/Android-SpeechService-Adapter-v0.2.13.toolpkg manifest.json main.js resources)
          python3 - <<'PY'
          import json,zipfile,pathlib
          for name in ("Android-VoiceService-Adapter-v0.2.13.toolpkg","Android-SpeechService-Adapter-v0.2.13.toolpkg"):
              p=pathlib.Path("dist")/name
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  assert "manifest.json" in names and "main.js" in names
                  m=json.loads(z.read("manifest.json"))
                  assert m["main"] in names
                  for r in m.get("resources",[]):
                      assert r["path"] in names, (name,r["path"])
              print(name,"archive preflight PASS")
          PY
          sha256sum dist/*.toolpkg > dist/SHA256SUMS-v0.2.13.txt
      - uses: actions/upload-artifact@v4
        with:
          name: voice-session-suite-v0.2.13
          path: dist/*
