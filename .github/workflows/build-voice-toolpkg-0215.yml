name: Build Voice ToolPkg v0.2.15
on:
  workflow_dispatch:
  push:
    branches: [toolpkg/voice-session-0.2.15]
    paths: ['toolpkg/voice-session-v0.2.15/**','.github/workflows/build-voice-toolpkg-0215.yml']
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v4
   - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
   - name: Strict canonical preflight and source-first compile
     run: |
      set -euo pipefail
      ROOT=toolpkg/voice-session-v0.2.15
      ! grep -R "function:exports\." "$ROOT"
      grep -R "function:onCreate" "$ROOT"/{coordinator,voice,speech}/main.js
      python3 - <<'PY'
      import json,pathlib
      root=pathlib.Path("toolpkg/voice-session-v0.2.15")
      for k in ("coordinator","voice","speech"):
       m=json.loads((root/k/"manifest.json").read_text())
       assert m["schema_version"]==1 and m["api_version"]=="1.0.0" and m["version"]=="0.2.15"
       assert (root/k/m["main"]).is_file()
       for r in m.get("resources",[]):
        assert set(("key","path","mime")) <= set(r), (k,r)
        assert "id" not in r, (k,r)
      PY
      A="$ANDROID_HOME/platforms/android-35/android.jar"; D="$ANDROID_HOME/build-tools/35.0.0/d8"
      for K in coordinator voice speech; do
       mkdir -p "$ROOT/$K/build/classes" "$ROOT/$K/resources" "/tmp/d8-$K"
       javac -source 8 -target 8 -cp "$A" -d "$ROOT/$K/build/classes" $(find "$ROOT/$K/src" -name '*.java')
       jar cf "/tmp/$K.jar" -C "$ROOT/$K/build/classes" .
       "$D" --lib "$A" --min-api 26 --output "/tmp/d8-$K" "/tmp/$K.jar"
      done
      cp /tmp/d8-coordinator/classes.dex "$ROOT/coordinator/resources/coordinator.dex"
      cp /tmp/d8-voice/classes.dex "$ROOT/voice/resources/voice-adapter.dex"
      cp /tmp/d8-speech/classes.dex "$ROOT/speech/resources/speech-adapter.dex"
   - name: Package and inspect every ToolPkg
     run: |
      set -euo pipefail; ROOT=toolpkg/voice-session-v0.2.15; mkdir -p dist
      (cd "$ROOT/coordinator" && zip -q -r ../../../dist/Voice-Session-Coordinator-v0.2.15.toolpkg manifest.json main.js resources)
      (cd "$ROOT/voice" && zip -q -r ../../../dist/Android-VoiceService-Adapter-v0.2.15.toolpkg manifest.json main.js resources)
      (cd "$ROOT/speech" && zip -q -r ../../../dist/Android-SpeechService-Adapter-v0.2.15.toolpkg manifest.json main.js resources)
      python3 - <<'PY'
      import json,zipfile,pathlib
      for p in pathlib.Path("dist").glob("*.toolpkg"):
       with zipfile.ZipFile(p) as z:
        n=z.namelist(); m=json.loads(z.read("manifest.json")); assert m["main"] in n
        for r in m["resources"]: assert r["path"] in n
       print(p.name,"PASS")
      PY
      sha256sum dist/*.toolpkg > dist/SHA256SUMS-v0.2.15.txt
   - uses: actions/upload-artifact@v4
     with: {name: voice-session-suite-v0.2.15, path: 'dist/*'}
